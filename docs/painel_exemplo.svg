    <line x1="20" y1="190" x2="300" y2="190" stroke="#38bdf8" stroke-dasharray="3,3" />
    <text x="15" y="186" text-anchor="end" fill="#38bdf8" font-family="monospace" font-size="10">≥ 1.80 m (Superior)</text>
    <rect x="450" y="210" width="280" height="45" fill="#38bdf8" opacity="0.1" />
    <line x1="20" y1="232" x2="480" y2="232" stroke="#fbbf24" stroke-dasharray="3,3" />
    <text x="15" y="228" text-anchor="end" fill="#fbbf24" font-family="monospace" font-size="10">1.20 a 1.50 m (Média)</text>
    <rect x="580" y="310" width="140" height="35" fill="#34d399" opacity="0.1" />
    <line x1="20" y1="324" x2="585" y2="324" stroke="#34d399" stroke-dasharray="3,3" />
    <text x="15" y="320" text-anchor="end" fill="#34d399" font-family="monospace" font-size="10">0.10 a 0.50 m (Baixa)</text>
  </g>
