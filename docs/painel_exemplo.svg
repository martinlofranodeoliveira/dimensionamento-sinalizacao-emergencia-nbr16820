    <line x1="25" y1="68" x2="435" y2="68" stroke="#374151" stroke-width="1" />
    <!-- Placa S-1: Saída de Emergência -->
    <rect x="25" y="85" width="410" height="95" rx="6" fill="#1f2937" stroke="#374151" stroke-width="1" />
    <rect x="40" y="100" width="130" height="65" rx="4" fill="#008751" stroke="#22c55e" stroke-width="2" />
    <circle cx="80" cy="120" r="5" fill="#ffffff" />
