    <text x="185" y="466" fill="#fecdd3" font-family="system-ui, sans-serif" font-size="11">Sinalização de Proibição (Diâmetro 200 mm)</text>
    <text x="185" y="482" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="11">Orla e barra diagonal vermelhas a 45°</text>
