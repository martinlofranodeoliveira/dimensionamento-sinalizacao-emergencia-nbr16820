    <text x="185" y="246" fill="#fecdd3" font-family="system-ui, sans-serif" font-size="11">Alarme e Combate (200x200 mm)</text>
    <text x="185" y="262" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="11">Instalação a 1,80 m do piso acabado</text>
