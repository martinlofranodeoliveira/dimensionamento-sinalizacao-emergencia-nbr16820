    <text x="45" y="220" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="11">K = 2000 (Fotoluminescente / Luz ext.)</text>
    <text x="45" y="240" fill="#fde047" font-family="system-ui, sans-serif" font-size="11">K = 1250 (Iluminação interna direta)</text>
    <text x="45" y="270" fill="#fca5a5" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">Espaçamento Rota: ≤ 15,0 m</text>
    <rect x="310" y="65" width="270" height="235" rx="6" fill="#1f2937" stroke="#374151" stroke-width="1" />
    <text x="325" y="92" fill="#34d399" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">TABELA DE DIMENSÕES (K = 2000)</text>
