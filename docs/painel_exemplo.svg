    <rect x="25" y="415" width="410" height="95" rx="6" fill="#1f2937" stroke="#374151" stroke-width="1" />
    <circle cx="102" cy="462" r="32" fill="#ffffff" stroke="#be123c" stroke-width="6" />
    <line x1="80" y1="440" x2="124" y2="484" stroke="#be123c" stroke-width="6" />
    <rect x="86" y="459" width="30" height="6" fill="#1a1a1a" />
