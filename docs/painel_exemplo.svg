    <text x="185" y="356" fill="#fecdd3" font-family="system-ui, sans-serif" font-size="11">Alarme de Emergência (150x150 mm)</text>
    <text x="185" y="372" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="11">Instalação a 1,20 m – 1,50 m do piso</text>
