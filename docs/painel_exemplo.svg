    <rect x="325" y="105" width="240" height="25" fill="#334155" />
    <text x="335" y="122" fill="#f8fafc" font-family="monospace" font-size="10" font-weight="bold">Dist (d)</text>
    <text x="405" y="122" fill="#f8fafc" font-family="monospace" font-size="10" font-weight="bold">Área Mín.</text>
    <text x="495" y="122" fill="#f8fafc" font-family="monospace" font-size="10" font-weight="bold">Padrão</text>
    <text x="335" y="148" fill="#e2e8f0" font-family="monospace" font-size="10">≤ 4,0 m</text>
    <text x="405" y="148" fill="#e2e8f0" font-family="monospace" font-size="10">0,008 m²</text>
    <text x="495" y="148" fill="#a7f3d0" font-family="monospace" font-size="10">100x100</text>
    <text x="335" y="174" fill="#e2e8f0" font-family="monospace" font-size="10">≤ 6,7 m</text>
    <text x="405" y="174" fill="#e2e8f0" font-family="monospace" font-size="10">0,022 m²</text>
    <text x="495" y="174" fill="#a7f3d0" font-family="monospace" font-size="10">150x150</text>
    <text x="335" y="200" fill="#e2e8f0" font-family="monospace" font-size="10">≤ 8,9 m</text>
    <text x="405" y="200" fill="#e2e8f0" font-family="monospace" font-size="10">0,040 m²</text>
    <text x="495" y="200" fill="#a7f3d0" font-family="monospace" font-size="10">200x200</text>
    <text x="335" y="226" fill="#e2e8f0" font-family="monospace" font-size="10">≤ 11,1 m</text>
    <text x="405" y="226" fill="#e2e8f0" font-family="monospace" font-size="10">0,062 m²</text>
    <text x="495" y="226" fill="#a7f3d0" font-family="monospace" font-size="10">250x250</text>
    <text x="335" y="252" fill="#e2e8f0" font-family="monospace" font-size="10">≤ 13,4 m</text>
    <text x="405" y="252" fill="#e2e8f0" font-family="monospace" font-size="10">0,090 m²</text>
    <text x="495" y="252" fill="#a7f3d0" font-family="monospace" font-size="10">300x300</text>
    <text x="335" y="278" fill="#e2e8f0" font-family="monospace" font-size="10">≤ 17,8 m</text>
    <text x="405" y="278" fill="#e2e8f0" font-family="monospace" font-size="10">0,160 m²</text>
    <text x="495" y="278" fill="#a7f3d0" font-family="monospace" font-size="10">400x400</text>
    <rect x="600" y="65" width="270" height="235" rx="6" fill="#1f2937" stroke="#374151" stroke-width="1" />
    <text x="615" y="92" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">DESEMPENHO FOTOLUMINESCENTE</text>
    <!-- Categoria W -->
    <rect x="615" y="105" width="240" height="75" rx="4" fill="#0f172a" stroke="#d97706" stroke-width="1" />
    <text x="625" y="125" fill="#fde047" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">CATEGORIA W (Padrão)</text>
    <text x="625" y="143" fill="#e2e8f0" font-family="monospace" font-size="10">10 min: ≥ 140 mcd/m²</text>
    <text x="625" y="160" fill="#e2e8f0" font-family="monospace" font-size="10">60 min: ≥ 20 mcd/m²</text>
    <text x="625" y="174" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="9">Atenuação mínima: 1800 min (30h)</text>
    <rect x="615" y="190" width="240" height="75" rx="4" fill="#0f172a" stroke="#ea580c" stroke-width="1" />
    <text x="625" y="210" fill="#fdba74" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">CATEGORIA X (Alta Performance)</text>
    <text x="625" y="228" fill="#e2e8f0" font-family="monospace" font-size="10">10 min: ≥ 210 mcd/m²</text>
    <text x="625" y="245" fill="#e2e8f0" font-family="monospace" font-size="10">60 min: ≥ 30 mcd/m²</text>
    <text x="625" y="259" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="9">Recomendado para hospitais e subsolos</text>
    <text x="615" y="288" fill="#64748b" font-family="system-ui, sans-serif" font-size="10">Ensaios conforme Anexo B da NBR 16820</text>
