    <text x="185" y="576" fill="#fef08a" font-family="system-ui, sans-serif" font-size="11">Sinalização de Alerta (Lado 200 mm)</text>
    <text x="185" y="592" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="11">Triângulo equilátero amarelo com símbolo preto</text>
    <!-- Demarcação de Piso de Extintor -->
    <rect x="25" y="635" width="410" height="105" rx="6" fill="#1f2937" stroke="#374151" stroke-width="1" />
    <rect x="70" y="650" width="65" height="65" fill="#FFC72C" stroke="#ca8a04" stroke-width="1" />
    <rect x="80" y="660" width="45" height="45" fill="#C8102E" />
