    <text x="185" y="136" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="11">Orientação e Salvamento (200x100 mm)</text>
    <text x="185" y="152" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="11">Verde segurança com símbolo fotoluminescente</text>
