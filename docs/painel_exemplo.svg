    <text x="185" y="683" fill="#fecdd3" font-family="system-ui, sans-serif" font-size="11">Quadrado 1,00 m x 1,00 m</text>
    <text x="185" y="700" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="11">Pintura vermelha central com borda amarela de 15 cm</text>
    <text x="185" y="718" fill="#fca5a5" font-family="system-ui, sans-serif" font-size="10">Área mantida rigorosamente desobstruída</text>
  </g>
  <g transform="translate(510, 110)">
