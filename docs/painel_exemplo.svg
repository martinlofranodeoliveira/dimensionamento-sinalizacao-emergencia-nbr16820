      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="100%" stop-color="#151e33" />
    </linearGradient>
    <linearGradient id="glowVerde" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="glowVermelho" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e11d48" />
      <stop offset="100%" stop-color="#be123c" />
    </linearGradient>
    <filter id="luminescencia" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="1440" height="900" fill="url(#bgGrad)" />
  <rect x="30" y="20" width="1380" height="75" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
  <text x="55" y="52" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="bold">LOFRANO TECNOLOGIA — ENGENHARIA DE SEGURANÇA CONTRA INCÊNDIO</text>
  <text x="55" y="76" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="14">SINALIZAÇÃO DE EMERGÊNCIA E ROTAS DE FUGA — ABNT NBR 16820:2020 (ZERO-FLOAT)</text>
  <rect x="1140" y="35" width="250" height="45" rx="6" fill="#065f46" stroke="#10b981" stroke-width="1.5" />
  <text x="1265" y="63" text-anchor="middle" fill="#34d399" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">CONFORME NBR 16820</text>
