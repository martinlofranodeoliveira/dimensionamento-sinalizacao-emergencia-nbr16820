    <rect x="313" y="240" width="24" height="60" rx="6" fill="#be123c" stroke="#f87171" stroke-width="1" />
    <rect x="290" y="345" width="70" height="10" fill="#FFC72C" />
    <rect x="300" y="347" width="50" height="6" fill="#C8102E" />
    <!-- Botoeira de Alarme na Faixa Média (1.20 - 1.50m) -->
    <rect x="485" y="215" width="35" height="35" rx="3" fill="#C8102E" stroke="#f43f5e" stroke-width="1.5" />
    <text x="502" y="237" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="9" font-weight="bold">A</text>
